<mat-card>
  <mat-card-header>
    <mat-card-title>
      {{ data ? 'Edit Book' : 'Add Book' }}
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form">
      <mat-form-field appearance="outline">
        <mat-label>Title</mat-label>
        <input matInput formControlName="title"/>
        @if (form.get('title')?.hasError('required') && form.get('title')?.touched) {
          <mat-error>Title is required</mat-error>
        }
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Author</mat-label>
        <input matInput formControlName="author"/>
        @if (form.get('author')?.hasError('required') && form.get('author')?.touched) {
          <mat-error>Author is required</mat-error>
        }
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>ISBN</mat-label>
        <input matInput formControlName="isbn"/>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Publishing Year</mat-label>
        <input matInput type="number" formControlName="publishingYear"/>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Genre</mat-label>
        <input matInput formControlName="genre"/>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Language</mat-label>
        <input matInput formControlName="language"/>
      </mat-form-field>
    </form>
  </mat-card-content>
  <mat-card-actions>
    <button mat-button (click)="dialogRef.close()">Cancel</button>
    <button [disabled]="form.invalid" mat-button (click)="onSubmit()">{{ data ? 'Save Book' : 'Add Book' }}</button>
  </mat-card-actions>
</mat-card>
