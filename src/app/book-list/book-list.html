<div class="container">
  <h1>Book Library</h1>
  <button (click)="openBookForm()" mat-button>Create a new book</button>
  @if (isLoading()) {
    <div class="spinner-container">
      <mat-spinner/>
    </div>
  } @else if (error()) {
    <p class="error">{{ error() }}</p>
  } @else {
    <app-book-table [booksList]="booksList()" (editBook)="openBookForm($event)"></app-book-table>
    <mat-paginator
      [length]="totalElements()"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[5, 10, 25]"
      (page)="onPageChange($event)"
    />
  }
</div>
